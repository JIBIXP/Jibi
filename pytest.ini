[pytest]
# Ces scripts sont des diagnostics manuels : ils accèdent au microphone,
# au VAD ou à un modèle de transcription au chargement. Ils ne doivent pas
# être importés par pytest, qui doit rester non interactif et reproductible.
addopts = --ignore=test_micro.py --ignore=test_transcription.py --ignore=test_vad.py
